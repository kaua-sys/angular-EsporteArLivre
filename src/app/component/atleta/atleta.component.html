<section id="form">
    <h2>Cadastro de Atleta</h2>

    <form action="" id="form-atleta" (submit) = 'salvar()'>
        <label for="nome">Nome Completo</label>
        <input type="text" name="nome" id="nome" [(ngModel)] = "nome" class="input01" maxlength="60" required placeholder="Digite seu nome completo">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" id="cpf" [(ngModel)] = "cpf" class="input02" maxlength="14" required placeholder="Digite seu CPF">

        <label for="sexo">Sexo</label>
        <input type="radio" name="sexo" id="sexoM" [(ngModel)] = "sexo" required value="M"> Masculino
        <input type="radio" name="sexo" id="sexoF" [(ngModel)] = "sexo" required value="F"> Feminino
        <input type="radio" name="sexo" id="sexoN" [(ngModel)] = "sexo" required value="N"> Não Declarar

        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" [(ngModel)] = "cep" class="input02" required maxlength="9" placeholder="Digite o seu cep">

        <label for="rua-logradouro">Rua/Logradouro</label>
        <input type="text" name="rua-logradouro" id="rua-logradouro" [(ngModel)] = "ruaLogradouro" class="input01" maxlength="100" required placeholder="Digite a Rua ou o Logradouro">

        <label for="bairro">Bairro</label>
        <input type="text" name="bairro" id="bairro" [(ngModel)] = "bairro" class="input02" maxlength="60" required placeholder="Digite o nome do seu Bairro">

        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" id="cidade" [(ngModel)] = "cidade" class="input02" maxlength="60" required placeholder="Digite o nome da sua Cidade">

        <label for="uf">UF</label>
        <input type="text" name="uf" id="uf" [(ngModel)] = "uf" class="input02" maxlength="60" required placeholder="Digite a sua UF">
        <div id="div-btns">
            <button type="submit" id="btnAdd">Cadastrar</button>
            <button type="reset" id="btnLimpar">Limpar</button>
        </div>
    </form>
</section>
